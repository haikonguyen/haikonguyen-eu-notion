summary:
  en: >-
    Ultra-lightweight, glassmorphic component library for modern web applications.
  cs: >-
    Ultra-lehká glassmorfická knihovna komponent pro moderní webové aplikace.
  vi: >-
    Thư viện component siêu nhẹ, glassmorphic cho ứng dụng web hiện đại.
longDescription:
  en: >-
    Nova UI is a design-first component library focusing on accessibility,
    micro-animations, and liquid glass aesthetic.
  cs: >-
    Nova UI je design-first knihovna komponent se zaměřením na přístupnost,
    mikroanimace a liquid glass estetiku.
  vi: >-
    Nova UI là thư viện component ưu tiên thiết kế, tập trung vào accessibility,
    micro-animation và thẩm mỹ liquid glass.
